name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8   # Windows-Runner nutzen sonst cp1252-Console (Unicode-Symbole!)
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (optional deps for deeper validation)
        run: python -m pip install --upgrade pip pyyaml jsonschema hatchling

      - name: Compile all Python sources
        run: python -m compileall -q install.py scripts skills

      - name: agentskills.io spec validation
        run: python scripts/validate_skills.py --skills-dir skills --strict --json-report spec-report.json

      - name: Script self-tests
        run: |
          python skills/session-audit/scripts/validate_audit.py --selftest
          python skills/session-audit/scripts/usage_from_langfuse.py --selftest
          python skills/session-audit/scripts/transcript_export.py --selftest

      - name: Installer smoke tests
        env:
          AUDIT_SKILLS_TARGETS: ${{ runner.temp }}/audit-skills-targets.json
        run: |
          python install.py --version
          python install.py --doctor --lang de
          python install.py --doctor --lang en
          python install.py --dry-run --all --non-interactive --set-home ./tmp-home
          python install.py --non-interactive --targets ./tmp-target --set-home ./tmp-home
          python install.py --list-targets --set-home ./tmp-home
          python install.py --update --dry-run --set-home ./tmp-home

      - name: Package build (wheel + sdist)
        run: python -m hatchling build

      - name: Wheel install + entry point check (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m venv .venv-check
          .venv-check/bin/python -m pip install --quiet --no-index --find-links dist audit-export-skill
          .venv-check/bin/audit-skills --version

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            spec-report.json
            dist/*
          if-no-files-found: ignore
