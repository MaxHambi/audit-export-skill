# Vorlage: .github/workflows/audit-gate.yml
# Merge-Sperre für Pull Requests, wenn das Audit-System Lücken hat.
# Voraussetzung: skills/session-audit/ ist im Repo vorhanden (Skill mitinstalliert/
# versioniert) ODER Pfad unten an die eigene Ablage anpassen.
#
# Installation:
#   cp skills/session-audit/assets/audit-gate.workflow.yml .github/workflows/audit-gate.yml
# Danach: Branch-Protection → Required status checks → "audit-gate" aktivieren.

name: audit-gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten (optional, verbessert Prüftiefe)
        run: python -m pip install --quiet pyyaml jsonschema

      - name: Skill-Selbsttests
        run: |
          python skills/session-audit/scripts/validate_audit.py --selftest
          python skills/session-audit/scripts/usage_from_langfuse.py --selftest

      - name: Audit-Gate
        run: |
          python skills/session-audit/scripts/audit_gate.py \
            --audit-dir docs/audit \
            --register docs/audit/register.md \
            --max-age-days 30

      - name: Meta-Audit-Report (nur Information, nicht blockierend)
        if: always()
        run: |
          python skills/meta-audit/scripts/audit_health.py \
            --dir docs/audit \
            --register docs/audit/register.md \
            --max-age-days 30 || true

      - name: Report als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-gate-report
          path: |
            docs/audit/health-report-*.md
          if-no-files-found: ignore
