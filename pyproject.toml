[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-export-skill"
version = "0.9.0"
description = "Agent Skills for evidence-based session audits, context handoffs, and disciplined AI project workflows (agentskills.io)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "MaxHambi" }]
keywords = ["agent-skills", "agentskills-io", "audit", "handoff", "session", "context",
            "workflow", "ai-agents", "observability", "deviation-log"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []  # bewusst: nur Stdlib (Universalität); Tiefe via [full]

[project.optional-dependencies]
full = ["pyyaml>=6.0", "jsonschema>=4.17"]

[project.urls]
Homepage = "https://github.com/MaxHambi/audit-export-skill"
Repository = "https://github.com/MaxHambi/audit-export-skill"
Changelog = "https://github.com/MaxHambi/audit-export-skill/blob/main/CHANGELOG.md"
Issues = "https://github.com/MaxHambi/audit-export-skill/issues"

[project.scripts]
audit-skills = "install:main"

[tool.hatch.build.targets.wheel]
include = ["install.py"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "audit_export_skill/skills"

[tool.hatch.build.targets.sdist]
include = ["install.py", "skills", "scripts", "README.md", "README.de.md",
           "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE", ".github"]
